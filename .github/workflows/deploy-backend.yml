name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_AR_REGION }}-docker.pkg.dev

      - name: Build Docker Image
        run: |
          docker build -t \
            ${{ secrets.GCP_AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPO }}/recruitment-backend:${{ github.sha }} \
            ./backend

      - name: Push to Artifact Registry
        run: |
          docker push \
            ${{ secrets.GCP_AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPO }}/recruitment-backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          SA_BASE64=$(base64 -w 0 /tmp/sa.json)
          rm /tmp/sa.json
          gcloud run deploy recruitment-backend \
            --image ${{ secrets.GCP_AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPO }}/recruitment-backend:${{ github.sha }} \
            --region ${{ secrets.GCP_AR_REGION }} \
            --allow-unauthenticated \
            --update-env-vars "GOOGLE_SERVICE_ACCOUNT_JSON_BASE64=${SA_BASE64},GOOGLE_DRIVE_RECRUITMENT_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}" \
            --port 8080
