name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_AR_REGION }}
  REPO: ${{ secrets.GCP_AR_REPO }}
  SERVICE_NAME: recruitment-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ REGION }}-docker.pkg.dev

      - name: Build Docker Image
        run: |
          docker build -t ${{ REGION }}-docker.pkg.dev/${{ PROJECT_ID }}/${{ REPO }}/${{ SERVICE_NAME }}:${{ github.sha }} ./backend

      - name: Push to Artifact Registry
        run: docker push ${{ REGION }}-docker.pkg.dev/${{ PROJECT_ID }}/${{ REPO }}/${{ SERVICE_NAME }}:${{ github.sha }}

      - name: Create Secret in Secret Manager
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa-key.json
          gcloud secrets create service-account-json \
            --data-file=/tmp/sa-key.json \
            --project=${{ PROJECT_ID }} || \
          gcloud secrets versions add service-account-json \
            --data-file=/tmp/sa-key.json \
            --project=${{ PROJECT_ID }}
          rm /tmp/sa-key.json

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ SERVICE_NAME }} \
            --image ${{ REGION }}-docker.pkg.dev/${{ PROJECT_ID }}/${{ REPO }}/${{ SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ REGION }} \
            --allow-unauthenticated \
            --set-secrets "GOOGLE_SERVICE_ACCOUNT_JSON=service-account-json:latest" \
            --set-env-vars "GOOGLE_DRIVE_RECRUITMENT_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}" \
            --port 8080
